<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSINT Issue Tracer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='6' cy='6' r='3' fill='%232f5bd3'/><circle cx='18' cy='8' r='2.5' fill='%23d0622a'/><circle cx='12' cy='18' r='2.5' fill='%231f9a6b'/><path d='M6 6L18 8M6 6L12 18' stroke='%23888' stroke-width='1.5'/></svg>">
<link rel="stylesheet" href="/static/app.css">

<body>
<div class="app">

      OSINT Issue Tracer

    <button class="btn primary" onclick="go('#/new')">+ Kasus baru</button>
    <div class="mut small" style="padding:0 6px">Kasus</div>
    <div class="case-list" id="caseList"></div>
    <div class="side-foot">
      <button class="btn" onclick="openSettings()">Pengaturan &amp; token</button>
      <button class="btn" onclick="toggleTheme()" id="themeBtn">Tema</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script src="/static/app.js"></script>
